<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSIT HEART | 완벽 이상형 찾기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Pretendard:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-dark: #0f0709;
            --bg-card: rgba(28, 14, 19, 0.65);
            --border-card: rgba(244, 114, 182, 0.18);
            --primary-pink: #f43f5e;
            --rose-accent: #fb7185;
            --text-title: #fff1f2;
            --text-sub: #9f8a93;
            --glass-glow: 0 0 35px rgba(244, 63, 94, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 20%, #2a0c16 0%, var(--bg-dark) 80%);
            color: var(--text-title);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-card);
            width: 100%;
            max-width: 500px;
            border-radius: 28px;
            padding: 36px 28px;
            box-shadow: var(--glass-glow), 0 30px 60px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .progress-wrapper {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            margin-bottom: 24px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-pink), var(--rose-accent));
            transition: width 0.35s ease;
        }

        .brand-tag {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 0.25em;
            color: var(--rose-accent);
            text-transform: uppercase;
            margin-bottom: 12px;
            display: block;
            text-align: center;
        }

        h1.main-title {
            font-size: 1.45rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 12px;
            text-align: center;
            word-break: keep-all;
        }

        .sub-desc {
            color: var(--text-sub);
            font-size: 0.9rem;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 28px;
            text-align: center;
            word-break: keep-all;
        }

        .screen {
            display: none;
            opacity: 0;
            transform: translateY(12px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .screen.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* 프로필 레이아웃 */
        .section-label {
            font-size: 0.85rem;
            color: var(--rose-accent);
            margin-bottom: 10px;
            font-weight: 500;
            display: block;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .select-btn {
            padding: 18px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: var(--text-title);
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }

        .select-btn.selected {
            background: rgba(244, 63, 94, 0.2);
            border-color: var(--primary-pink);
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.3);
            color: #fff;
            font-weight: 600;
        }

        /* 질문 옵션 버턴 */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .opt-btn {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            color: var(--text-title);
            font-size: 0.92rem;
            line-height: 1.45;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            word-break: keep-all;
        }

        .opt-btn:hover {
            background: rgba(244, 63, 94, 0.15);
            border-color: var(--rose-accent);
            transform: translateY(-2px);
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary-pink), #e11d48);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 25px rgba(244, 63, 94, 0.35);
            margin-top: 10px;
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        /* 결과 창 스타일 */
        .result-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 20px;
            margin-top: 18px;
        }

        .img-wrapper {
            width: 100%;
            height: 320px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        .celeb-tag {
            font-size: 0.88rem;
            color: var(--rose-accent);
            background: rgba(244, 63, 94, 0.12);
            padding: 8px 14px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 16px;
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        .type-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            text-align: center;
        }

        .desc-text {
            font-size: 0.88rem;
            color: var(--text-sub);
            line-height: 1.7;
            font-weight: 300;
            word-break: keep-all;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 16px 0;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="progress-wrapper" id="progressWrapper">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- 1페이지: 프로필 설정 (성별 & 나이) -->
    <div id="step1" class="screen active">
        <span class="brand-tag">TRANSIT HEART</span>
        <h1 class="main-title">나의 세부 프로필 설정</h1>
        <p class="sub-desc">당신의 연령과 성별에 맞춰<br>가장 정확한 이상형 연예인을 분석합니다.</p>

        <span class="section-label">1. 당신의 성별은?</span>
        <div class="grid-2">
            <div class="select-btn" id="gF" onclick="setGender('F')">여성 (남성 매칭)</div>
            <div class="select-btn" id="gM" onclick="setGender('M')">남성 (여성 매칭)</div>
        </div>

        <span class="section-label">2. 당신의 연령대는?</span>
        <div class="grid-2">
            <div class="select-btn" id="a1020" onclick="setAge('1020')">10대 ~ 20대 초반</div>
            <div class="select-btn" id="a2030" onclick="setAge('2030')">20대 후반 ~ 30대 이상</div>
        </div>

        <button class="btn-primary" onclick="startQuestions()">이상형 찾기 시작</button>
    </div>

    <!-- 2페이지부터: 18개 질문 순차 진행 -->
    <div id="stepQuestions" class="screen">
        <span class="brand-tag" id="qNum">01 / 18</span>
        <h1 class="main-title" id="qTitle">질문 제목</h1>
        <div class="options-list" id="optsContainer"></div>
    </div>

    <!-- 최종 페이지: 분석 결과 -->
    <div id="stepResult" class="screen">
        <span class="brand-tag">MATCHING ANALYSIS</span>
        <h1 class="main-title" style="margin-bottom: 20px;">당신의 운명적 이상형 분석 결과</h1>

        <div class="result-box">
            <div class="img-wrapper">
                <img id="resImg" src="" alt="이상형 예시 이미지">
            </div>
            <div class="celeb-tag" id="resCeleb">대표 연예인 라인업</div>
            <div class="type-title" id="resTitle">이상형 타이틀</div>
            <div class="divider"></div>
            <div class="desc-text" id="resDesc">상세 설명이 표출됩니다.</div>
        </div>

        <button class="btn-primary" onclick="resetTest()" style="margin-top: 20px;">다시 테스트하기</button>
    </div>
</div>

<script>
    let userGender = 'F';
    let userAge = '1020';
    let currentQ = 0;
    let scores = { SOFT: 0, CHIC: 0, MATURE: 0, ENERGETIC: 0 };

    function setGender(g) {
        userGender = g;
        document.getElementById('gF').classList.toggle('selected', g === 'F');
        document.getElementById('gM').classList.toggle('selected', g === 'M');
    }

    function setAge(a) {
        userAge = a;
        document.getElementById('a1020').classList.toggle('selected', a === '1020');
        document.getElementById('a2030').classList.toggle('selected', a === '2030');
    }

    setGender('F');
    setAge('1020');

    // 18개 구체적 질문 데이터셋
    function getQuestionList() {
        const isF = userGender === 'F';
        return [
            {
                q: isF ? "선호하는 남성의 이상적인 키(Height)는?" : "선호하는 여성의 이상적인 키(Height)는?",
                a: isF ? [
                    { text: "180cm 이상! 크고 듬직하게 폭 안길 수 있는 키", s: { MATURE: 2, CHIC: 1 } },
                    { text: "175cm~180cm 부근의 깔끔하고 슬림한 피지컬", s: { SOFT: 1, CHIC: 2 } },
                    { text: "나와 눈높이가 잘 맞고 따뜻한 편안한 키", s: { SOFT: 2 } },
                    { text: "키보다는 비율과 전체적인 패션 핏이 중요함", s: { ENERGETIC: 2 } }
                ] : [
                    { text: "168cm 이상! 비율 좋고 스타일리시한 모델 핏", s: { CHIC: 2 } },
                    { text: "162cm~167cm 부근의 이상적이고 예쁜 비율", s: { MATURE: 2 } },
                    { text: "160cm 이하! 품에 쏙 들어오는 아담하고 귀여운 키", s: { SOFT: 2 } },
                    { text: "키는 무관하며 유쾌하고 시원시원한 매력이 우선", s: { ENERGETIC: 2 } }
                ]
            },
            {
                q: "가장 선호하는 상대방의 얼굴 상(비주얼 이미지)은?",
                a: [
                    { text: "순하고 부드러운 멍뭉미/두부상 (강아지상)", s: { SOFT: 2 } },
                    { text: "날카롭고 세련된 도도한 냉미남/냉미녀 (고양이상)", s: { CHIC: 2 } },
                    { text: "성숙하고 깊이감 있는 뚜렷한 이목구비 (사슴/공룡상)", s: { MATURE: 2 } },
                    { text: "웃을 때 상큼하고 긍정 에너지가 퍼지는 비타민상", s: { ENERGETIC: 2 } }
                ]
            },
            {
                q: "상대방의 평소 패션 스타일로 선호하는 것은?",
                a: [
                    { text: "깔끔하고 모던한 셔츠, 슬랙스, 수트 룩", s: { MATURE: 2 } },
                    { text: "트렌디하고 감각적인 스트릿/세련된 캐주얼", s: { CHIC: 2 } },
                    { text: "편안하면서도 센스 있는 데일리 꾸안꾸 룩", s: { SOFT: 2 } },
                    { text: "스포티하고 활기찬 아웃도어/블록코어 룩", s: { ENERGETIC: 2 } }
                ]
            },
            {
                q: "상대방의 분위기 중 가장 설레는 순간은?",
                a: [
                    { text: "나를 보며 사르르 지어주는 따뜻한 눈웃음", s: { SOFT: 2 } },
                    { text: "자기 일에 몰입할 때의 시크하고 집중한 표정", s: { CHIC: 2 } },
                    { text: "말없이 묵묵히 나를 배려하고 챙겨주는 진중함", s: { MATURE: 2 } },
                    { text: "장난기 가득한 웃음으로 내 기분을 풀어줄 때", s: { ENERGETIC: 2 } }
                ]
            },
            {
                q: "연락 문제에 대한 당신의 이상적인 기준은?",
                a: [
                    { text: "소소한 일상도 꾸준히 공유하는 다정한 연락", s: { SOFT: 2 } },
                    { text: "각자 일할 땐 집중하고 할 때만 확실히 하는 깔끔함", s: { CHIC: 2 } },
                    { text: "서로 신뢰를 바탕으로 여유롭게 주고받는 방식", s: { MATURE: 2 } },
                    { text: "심심할 틈 없이 티키타카 유쾌한 대화 체계", s: { ENERGETIC: 2 } }
                ]
            },
            {
                q: "첫 데이트로 가장 원해왔던 코스는?",
                a: [
                    { text: "한적한 골목 카페와 고즈넉한 공원 산책", s: { SOFT: 2 } },
                    { text: "감각적인 전시회나 트렌디한 핫플 팝업스토어", s: { CHIC: 2 } },
                    { text: "파인다이닝이나 야경이 멋진 분위기 있는 와인바", s: { MATURE: 2 } },
                    { text: "드라이브, 액티비티 등 활동적이고 신나는 코스", s: { ENERGETIC: 2 } }
                ]
            },
            {
                q: "상대방의 가장 매력적인 '음성/목소리' 스타일은?",
                a: [
                    { text: "부드럽고 귓가에 차분하게 감기는 미성", s: { SOFT: 2 } },
                    { text: "낮고 묵직해 안정감을 주는 울림 있는 중저음", s: { MATURE: 2 } },
                    { text: "지적이고 똑부러지는 톤의 명확한 목소리", s: { CHIC: 2 } },
                    { text: "밝고 생기 넘쳐 듣기만 해도 기분 좋은 목소리", s: { ENERGETIC: 2 } }
                ]
            },
            {
                q: "연인 사이에 갈등이 생겼을 때 바라는 상대방의 태도는?",
                a: [
                    { text: "먼저 다가와 따뜻한 손길로 마음을 녹여주기", s: { SOFT: 2 } },
                    { text: "감정 소비 없이 원인을 냉정하고 솔직하게 정리하기", s: { CHIC: 2 } },
                    { text: "차분히 시간을 갖고 서로 이해하려 대화하기", s: { MATURE: 2 } },
                    { text: "기분 전환을 도와주며 쿨하게 털어버리기", s: { ENERGETIC: 2 } }
                ]
            },
            {
                q: "상대방의 성격 중 가장 용납하기 힘든 부분은?",
                a: [
                    { text: "차가운 말투와 무심한 태도", s: { SOFT: 2 } },
                    { text: "자기관리 안 되고 우유부단한 모습", s: { MATURE: 2 } },
                    { text: "지나치게 진지해서 같이 있으면 지루한 분위기", s: { ENERGETIC: 2 } },
                    { text: "센스 없고 트렌드에 지나치게 뒤처지는 스타일", s: { CHIC: 2 } }
                ]
            },
            {
                q: "연인과 공유하고 싶은 주말의 일상은?",
                a: [
                    { text: "집에서 함께 영화 보고 맛있는 걸 만들어 먹는 힐링", s: { SOFT: 2 } },
                    { text: "예쁜 옷 맞춰 입고 스냅 사진 남기러 나가는 하루", s: { CHIC: 2 } },
                    { text: "서로 자기계발이나 책을 읽으며 여유를 즐기는 시간", s: { MATURE: 2 } },
                    { text: "새로운 취미나 운동, 여행을 떠나는 다이나믹함", s: { ENERGETIC: 2 } }
                ]
            },
            {
                q: "어떤 매너/행동에 가장 심장이 뛰시나요?",
                a: [
                    { text: "내가 지나치듯 말한 취향을 기억하고 챙겨줄 때", s: { SOFT: 2 } },
                    { text: "문 열어주기, 차도 쪽으로 걸어가기 등 몸에 밴 매너", s: { MATURE: 2 } },
                    { text: "어디서나 당당하고 자신감 있게 행동하는 아우라", s: { CHIC: 2 } },
                    { text: "어색한 상황도 유쾌하게 풀어나가는 위트", s: { ENERGETIC: 2 } }
                ]
            },
            {
                q: "선호하는 연애의 속도감은 어떤 편인가요?",
                a: [
                    { text: "천천히 서로를 알아가며 스며드는 잔잔한 연애", s: { SOFT: 2 } },
                    { text: "첫눈에 강렬하게 끌려 빠르게 타오르는 연애", s: { CHIC: 2 } },
                    { text: "서로의 비전과 가치관을 맞춰가는 신중한 연애", s: { MATURE: 2 } },
                    { text: "친구처럼 즐겁게 시작해 거침없이 발전하는 연애", s: { ENERGETIC: 2 } }
                ]
            },
            {
                q: "상대방의 '손'이나 '피지컬'에서 느껴지는 이상형 조건은?",
                a: [
                    { text: "길고 섬세하여 보기만 해도 다정해 보이는 손", s: { SOFT: 2 } },
                    { text: "손마디가 굵고 핏줄이 드러나 섹시함이 느껴지는 손", s: { CHIC: 2 } },
                    { text: "어깨가 넓고 두터워 잡았을 때 안정감을 주는 손", s: { MATURE: 2 } },
                    { text: "활동적인 움직임과 잔근육이 매력적인 체형", s: { ENERGETIC: 2 } }
                ]
            },
            {
                q: "연인이 나에게 표현해주길 바라는 방식은?",
                a: [
                    { text: "아침저녁으로 전해주는 따뜻한 애정 표현", s: { SOFT: 2 } },
                    { text: "말보다는 행동이나 서프라이즈 선물로 보여주는 방식", s: { CHIC: 2 } },
                    { text: "진심 어린 눈빛과 묵직한 확신을 주는 고백", s: { MATURE: 2 } },
                    { text: "아낌없는 칭찬과 리액션으로 자존감 세워주기", s: { ENERGETIC: 2 } }
                ]
            },
            {
                q: "상대방의 SNS나 인스타그램 스타일 취향은?",

    let questionsList = [];

    function startQuestions() {
        scores = { SOFT: 0, CHIC: 0, MATURE: 0, ENERGETIC: 0 };
        currentQ = 0;
        questionsList = getQuestionList();

        switchPage('step1', 'stepQuestions');
        document.getElementById('progressWrapper').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = questionsList[currentQ];
        const num = currentQ + 1;
        
        document.getElementById('qNum').innerText = `${num < 10 ? '0' + num : num} / ${questionsList.length}`;
        document.getElementById('qTitle').innerText = q.q;

        const progressPercent = (num / questionsList.length) * 100;
        document.getElementById('progressBar').style.width = `${progressPercent}%`;

        const container = document.getElementById('optsContainer');
        container.innerHTML = '';

        q.a.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt.text;
            btn.onclick = () => handleAnswer(opt.s);
            container.appendChild(btn);
        });
    }

    function handleAnswer(s) {
        for (let k in s) {
            scores[k] += s[k];
        }

        currentQ++;
        if (currentQ < questionsList.length) {
            showQuestion();
        } else {
            renderResult();
        }
    }

    function renderResult() {
        document.getElementById('progressWrapper').style.display = 'none';
        switchPage('stepQuestions', 'stepResult');

        let topKey = 'SOFT';
        let maxVal = -1;
        for (let k in scores) {
            if (scores[k] > maxVal) {
                maxVal = scores[k];
                topKey = k;
            }
        }

        const data = resultDB[userGender][userAge][topKey];

        document.getElementById('resTitle').innerText = data.title;
        document.getElementById('resCeleb').innerText = data.celeb;
        document.getElementById('resDesc').innerText = data.desc;
        document.getElementById('resImg').src = data.img;
    }

    function resetTest() {
        switchPage('stepResult', 'step1');
    }

    function switchPage(fromId, toId) {
        const from = document.getElementById(fromId);
        const to = document.getElementById(toId);

        from.style.opacity = '0';
        from.style.transform = 'translateY(12px)';

        setTimeout(() => {
            from.classList.remove('active');
            to.classList.add('active');
            setTimeout(() => {
                to.style.opacity = '1';
                to.style.transform = 'translateY(0)';
            }, 50);
        }, 350);
    }
